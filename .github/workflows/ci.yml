# W891 — this repo's first CI. Until now every gate (`pnpm check`: typecheck /
# lint / arch / test / web) only ran when a human remembered to run it, which is
# not a gate (docs/AGENT.md §8). Two OSes on purpose: Windows is a platform this
# repo now claims to support, so it must be measured rather than assumed.
#
# Node is a MATRIX, not `.nvmrc`'s single value. engines.node claims ">=24 <27",
# and a band measured at one point is a claim, not a measurement (W203 audit:
# "只测一个 Node 版本，而 engines.node 声称 >=24 <27"). 25 is deliberately absent:
# vitest's own engines (`^22.12.0 || ^24.0.0 || >=26.0.0`) excludes it and
# `engineStrict: true` turns that into a hard install failure — a DEV-side limit
# only, since vitest is a devDependency and production still runs on 25.
name: ci

on:
  push:
    branches: [main]
    # Tags too, and not for decoration: a release tag is a PUBLISHED artifact's
    # identity (the frontend version derives from `git describe --tags`), so
    # "did this tag pass CI?" must be answerable by looking at the tag, not by
    # tracing which main push happened to carry the same sha. W1519 learned this
    # the hard way: v2.7.5 was tagged on a commit whose CI was red on
    # windows-latest, and nothing about the tag said so.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
        # W9224：测试分片。本机实测（3 workers 模拟 4 核 runner）：
        # 全量 61.8s → 2 片各 ~32.8s → 3 片各 ~23s。分片是**并行 job**，
        # 所以墙钟≈单片时长。只在 test 那一步用（其余门禁是秒级，分片无意义）。
        shard: [1, 2, 3]
    steps:
      # Full history + tags: the version derives from `git describe --tags`
      # (scripts/version.mjs), and the web bundle embeds it. A shallow checkout
      # would make the version gate meaningless.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # W9112 follow-up: ONE `pnpm check` step meant a red run reported only
      # "Process completed with exit code 1" — the failing GATE was not
      # identifiable from the annotations at all, and the job logs need admin
      # rights to download. Splitting the chain into one step per gate makes
      # every failure name itself in the run summary, which is exactly what a
      # gate is for. The commands are the same ones `pnpm check` runs, in the
      # same order. `pnpm check` (local) is now `node scripts/check-parallel.mjs`,
      # which runs these SAME gate commands concurrently + with eslint/tsc caches; CI
      # deliberately keeps them as separate serial steps so each failure names itself.
      - name: typecheck
        if: ${{ matrix.shard == 1 }}
        run: node scripts/run-gate.mjs typecheck -- pnpm typecheck
      - name: lint
        if: ${{ matrix.shard == 1 }}
        run: node scripts/run-gate.mjs lint -- pnpm lint
      - name: lint:arch
        if: ${{ matrix.shard == 1 }}
        run: node scripts/run-gate.mjs lint:arch -- pnpm lint:arch
      - name: check:tmpdir
        if: ${{ matrix.shard == 1 }}
        run: node scripts/run-gate.mjs check:tmpdir -- pnpm check:tmpdir
      # W9323：同步阻塞调用不得出现在事件回调 / 定时器 / 请求处理器里。
      # 上下文：W9321 的 taskkillTree 让「按 Stop」同步卡死约 15s，同类缺陷当时没人知道有多少。
      - name: check:sync-in-callback
        if: ${{ matrix.shard == 1 }}
        run: node scripts/run-gate.mjs check:sync-in-callback -- pnpm check:sync-in-callback
      # W9323：注释里的 file.ts:NN 行号引用会静默腐烂，改用 [symbol] 符号引用。
      - name: check:comment-refs
        if: ${{ matrix.shard == 1 }}
        run: node scripts/run-gate.mjs check:comment-refs -- pnpm check:comment-refs
      # 分片只在 test 上生效；其余门禁跑在 shard 1 上（每 OS×Node 组合各一次），
      # 否则同一份 typecheck/lint 会被重复跑 3 遍（纯浪费，且 CI 分钟数翻倍）。
      - name: test (shard ${{ matrix.shard }}/3)
        run: node scripts/run-gate.mjs "test shard ${{ matrix.shard }}/3" -- pnpm exec vitest run --shard=${{ matrix.shard }}/3
        env:
          CI: 'true'
      # check:web is itself a chain (build -> tsc -> 7 sub-gates). Splitting it
      # too, and routing each gate through
      # scripts/run-gate.mjs so a failure emits its OWN message as a GitHub
      # annotation: the run that first reached this stage reported only
      # "exit code 1", and the job log needs admin rights to download.
      - name: check:web build
        if: ${{ matrix.shard == 1 }}
        run: node scripts/run-gate.mjs "check:web build" -- pnpm --dir apps/web run build
      - name: check:web typecheck
        if: ${{ matrix.shard == 1 }}
        run: node scripts/run-gate.mjs "check:web tsc" -- pnpm --dir apps/web exec tsc --noEmit
      - name: check:web copy gate
        if: ${{ matrix.shard == 1 }}
        run: node scripts/run-gate.mjs "check-ui-copy" -- node apps/web/tools/check-ui-copy.mjs
      - name: check:web scope-hash
        if: ${{ matrix.shard == 1 }}
        run: node scripts/run-gate.mjs "check-scope-hash" -- node apps/web/tools/check-scope-hash.mjs
      - name: check:web sse-events
        if: ${{ matrix.shard == 1 }}
        run: node scripts/run-gate.mjs "check-sse-events" -- node apps/web/tools/check-sse-events.mjs
      - name: check:web fold-default
        if: ${{ matrix.shard == 1 }}
        run: node scripts/run-gate.mjs "check-fold-default" -- node apps/web/tools/check-fold-default.mjs
      - name: check:web grants-permanent
        if: ${{ matrix.shard == 1 }}
        run: node scripts/run-gate.mjs "check-grants-permanent" -- node apps/web/tools/check-grants-permanent.mjs
      - name: check:web module-size
        if: ${{ matrix.shard == 1 }}
        run: node scripts/run-gate.mjs "check-module-size" -- node apps/web/tools/check-module-size.mjs
      - name: check:web version
        if: ${{ matrix.shard == 1 }}
        run: node scripts/run-gate.mjs "check-version" -- node apps/web/tools/check-version.mjs
